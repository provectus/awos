name: Publish Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.2.3 or 1.2.3-beta.1)'
        required: true
        type: string
      tag:
        description: 'npm tag (use "latest" for stable, or custom tag for prereleases)'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  id-token: write

# One group per version: a shared group keeps only one pending run, so a
# third queued release would cancel the second before it ever published.
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # One scope failing must not cancel the other mid-publish.
      fail-fast: false
      matrix:
        scope:
          - '@provectusinc/awos'
          - '@provectus/awos'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships with npm 11.5.1+, which already supports OIDC
          # trusted publishing — no global npm upgrade needed.
          node-version: '24'
          # DO NOT use registry-url - it interferes with OIDC

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Determine version and tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # From release event - extract version from tag
            release_tag="${{ github.event.release.tag_name }}"
            version=$(echo "$release_tag" | sed 's/^v//')
            tag="latest"
          else
            # From workflow_dispatch - use inputs
            version="${{ inputs.version }}"
            tag="${{ inputs.tag }}"
          fi
          echo "Version: $version"
          echo "Tag: $tag"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Rewrite package name to ${{ matrix.scope }}
        run: npm pkg set name="${{ matrix.scope }}"

      - run: npm install

      # The version comes from the release tag, so an existing version means
      # this is a re-run — skip it so only the missing scope gets published.
      - name: Check whether version is already published
        id: published
        run: |
          version="${{ steps.version.outputs.version }}"
          if npm view "${{ matrix.scope }}@$version" version 2>/dev/null | grep -qx "$version"; then
            echo "::notice::${{ matrix.scope }}@$version already on npm, skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm via OIDC
        if: steps.published.outputs.skip != 'true'
        run: npm publish --access public --provenance --tag ${{ steps.version.outputs.tag }}
